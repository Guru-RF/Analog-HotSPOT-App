name: Build & Release

# Push a tag like v1.0.0 to trigger a full release build.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ── Stage 1: create the GitHub Release with release notes ──────────────────
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

  # ── Stage 2: build each platform and upload artifacts ─────────────────────
  build:
    name: Build — ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: build:mac
            artifacts: dist/*.dmg

          - name: Windows
            os: windows-latest
            script: build:win
            artifacts: dist/*.exe

          - name: Linux
            os: ubuntu-latest
            script: build:linux
            artifacts: dist/*.AppImage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # macOS: import the Developer ID cert into an ephemeral keychain.
      # apple-actions/import-codesign-certs handles Keychain-Access legacy p12s,
      # ephemeral keychain creation, partition-list wiring, and cleanup on
      # post-job — all the fiddly bits we were hand-rolling.
      - name: Import Developer ID certificate
        if: matrix.os == 'macos-latest'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MAC_CERTIFICATE }}
          p12-password: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          keychain-password: github-runner-ephemeral

      # The default partition-list `apple-tool:,apple:` is missing `codesign:`,
      # which the v1.0.6 attempt was bitten by: signing hung for an hour with
      # no log output because every codesign invocation was waiting on a
      # never-arriving Keychain Access prompt. Forcing the entry plus a long
      # unlock prevents that on ephemeral CI keychains.
      - name: Grant unattended codesign access to private key
        if: matrix.os == 'macos-latest'
        run: |
          KC=$(security list-keychains -d user | head -1 | xargs)
          echo "Target keychain: $KC"
          security unlock-keychain -p github-runner-ephemeral "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security set-key-partition-list \
            -S 'apple-tool:,apple:,codesign:' \
            -s -k github-runner-ephemeral "$KC"

      - name: Verify codesigning identity
        if: matrix.os == 'macos-latest'
        run: security find-identity -v -p codesigning

      # Pre-flight: hit Apple's notary service with the SAME credentials
      # `notarytool submit` will use, but a cheap call that returns in a few
      # seconds. Three outcomes tell us where the previous hang lives:
      #  - returns history → credentials and network are fine, hang is the
      #    upload itself or an electron-builder issue
      #  - "Authentication failed" → APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
      #    APPLE_TEAM_ID is wrong (most likely the app-specific password)
      #  - hangs past timeout → DNS / firewall / Apple service issue
      - name: Pre-flight notarize credentials test
        if: matrix.os == 'macos-latest'
        timeout-minutes: 3
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "APPLE_ID length: ${#APPLE_ID}"
          echo "APPLE_TEAM_ID length: ${#APPLE_TEAM_ID}"
          echo "APPLE_APP_SPECIFIC_PASSWORD length: ${#APPLE_APP_SPECIFIC_PASSWORD}"
          echo "Calling notarytool history…"
          time xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" 2>&1 | head -30
          echo "history exit=${PIPESTATUS[0]}"

      - name: Build macOS (signed + notarized)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEBUG: "electron-builder,electron-osx-sign,@electron/osx-sign,@electron/notarize"
        # Codesign by itself runs in ~4 min (verified by the sign-only
        # diagnostic). The extra budget here is for Apple's notary queue,
        # which can take 30+ min for a brand-new team's first submission.
        timeout-minutes: 60
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Build (unsigned)
        if: matrix.os != 'macos-latest'
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}
