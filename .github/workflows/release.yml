name: Build & Release

# Push a tag like v1.0.0 to trigger a full release build. workflow_dispatch
# lets an operator re-run on an existing tag (no destructive tag re-push).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re-)build, e.g. v1.0.9
        required: true
        type: string

# Only one release pipeline runs at a time per tag — protects against two
# near-simultaneous tag pushes racing on notarytool submissions / release
# asset uploads.
concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── Stage 1: create the GitHub Release as a DRAFT ────────────────────────
  # Was published immediately, which meant v1.0.7's update-notifier could
  # point users at a release whose macOS DMGs hadn't even been built yet.
  # We now create draft + promote on success in stage 3.
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: false

  # ── Stage 2: build each platform and upload artifacts ─────────────────────
  build:
    name: Build — ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: build:mac
            artifacts: dist/*.dmg

          - name: Windows
            os: windows-latest
            script: build:win
            artifacts: dist/*.exe

          - name: Linux
            os: ubuntu-latest
            script: build:linux
            artifacts: dist/*.AppImage

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # macOS: import the Developer ID cert into an ephemeral keychain.
      - name: Import Developer ID certificate
        if: matrix.os == 'macos-latest'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MAC_CERTIFICATE }}
          p12-password: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          keychain-password: github-runner-ephemeral

      - name: Grant unattended codesign access to private key
        if: matrix.os == 'macos-latest'
        run: |
          KC=$(security list-keychains -d user | head -1 | xargs)
          echo "Target keychain: $KC"
          security unlock-keychain -p github-runner-ephemeral "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security set-key-partition-list \
            -S 'apple-tool:,apple:,codesign:' \
            -s -k github-runner-ephemeral "$KC"

      - name: Verify codesigning identity
        if: matrix.os == 'macos-latest'
        run: |
          set -e
          security find-identity -v -p codesigning
          # Fail fast if no Developer ID Application identity made it into
          # the ephemeral keychain — saves us 90 min of notarize attempts.
          count=$(security find-identity -v -p codesigning | grep -c "Developer ID Application" || true)
          if [ "$count" -lt 1 ]; then
            echo "::error::No Developer ID Application identity found in keychain"
            exit 1
          fi

      # Pre-flight: hit Apple's notary service with the credentials notarytool
      # submit will use. Fail-stop the WHOLE job on non-zero exit so a wrong
      # APPLE_APP_SPECIFIC_PASSWORD doesn't waste 105 min before we discover
      # it. The previous version used `head -30` in a pipe, which made
      # PIPESTATUS[0] just echoed instead of asserted.
      - name: Pre-flight notarize credentials test
        if: matrix.os == 'macos-latest'
        timeout-minutes: 3
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          echo "APPLE_ID length: ${#APPLE_ID}"
          echo "APPLE_TEAM_ID length: ${#APPLE_TEAM_ID}"
          echo "APPLE_APP_SPECIFIC_PASSWORD length: ${#APPLE_APP_SPECIFIC_PASSWORD}"
          echo "Calling notarytool history…"
          if ! xcrun notarytool history \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" > /tmp/notarytool-history.log 2>&1; then
            rc=$?
            echo "::error::notarytool history failed (exit $rc) — check APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID"
            head -40 /tmp/notarytool-history.log
            exit $rc
          fi
          head -30 /tmp/notarytool-history.log

      - name: Build macOS (signed only — notarize comes after)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        timeout-minutes: 15
        run: npm run ${{ matrix.script }} -- --publish never

      # electron-builder's notarize wait was hanging up to an hour even though
      # `notarytool history` confirmed our submissions reached status:Accepted
      # on Apple's side within a few minutes. Drive notarytool ourselves so we
      # see every progress line and have a tight, predictable timeout. The
      # step is allowed to fail (continue-on-error) so we still upload a
      # signed-but-un-stapled DMG if Apple's queue exceeds the 90-min budget;
      # stage 3 won't promote the draft to public if any required artifact is
      # missing, so users on auto-update are never sent to a broken release.
      - name: Notarize and staple DMGs (parallel notarytool)
        if: matrix.os == 'macos-latest'
        timeout-minutes: 90
        continue-on-error: true
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          shopt -s nullglob
          DMGS=(dist/*.dmg)
          if [ ${#DMGS[@]} -eq 0 ]; then
            echo "::error::No DMGs found in dist/ — nothing to notarize."
            exit 1
          fi
          notarize_one() {
            local dmg="$1"
            local tag="[$(basename "$dmg")]"
            echo "$tag === Submitting + waiting ==="
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait 2>&1 | sed "s|^|$tag |"
            echo "$tag === Stapling ==="
            xcrun stapler staple "$dmg" 2>&1 | sed "s|^|$tag |"
            xcrun stapler validate "$dmg" 2>&1 | sed "s|^|$tag |"
          }
          pids=()
          for dmg in "${DMGS[@]}"; do
            notarize_one "$dmg" &
            pids+=($!)
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=$?
          done
          exit $status

      - name: Build (unsigned)
        if: matrix.os != 'macos-latest'
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Upload artifacts to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ matrix.artifacts }}
          draft: true

  # ── Stage 3: flip the draft to a public release ──────────────────────────
  # Only runs after every matrix leg succeeded; if any platform build failed
  # the draft stays a draft and the update notifier keeps pointing users at
  # the previous good release.
  promote-release:
    name: Promote draft to public release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Promote release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: true
